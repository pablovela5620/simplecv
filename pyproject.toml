[project]
name = "simplecv"
version = "0.6.0"
description = "CV Utilities for Python"
authors = [{ name = "pablovela5620", email = "pablovela5620@gmail.com" }]
requires-python = ">= 3.10"
dependencies = [
    "jaxtyping>=0.3.7,<0.3.8",
    "numpy>=2.0",
    "einops>=0.8.0",
    "icecream>=2.1.3",
    "opencv-python>=4.10.0",
    "pyserde>=0.20.0",
    "rerun-sdk[datafusion]>=0.30",
    "tyro>=0.9.1",
    "tqdm",
    "hf-transfer>=0.1.9",
    "lovely-numpy>=0.2.13,<0.3",
    "pandas>=2.3.3",
    "onnxruntime>=1.22.0,<2",
    "universal_pathlib>=0.3.7",
    "s3fs>=2025.3.0",
]

[project.scripts]
simplecv-ingest-exoego = "simplecv.apis.ingest_exoego_recording:entrypoint"
simplecv-view-exoego = "simplecv.apis.view_exoego:entrypoint"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simplecv*", "tools*", "tests*"]

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
view-polycam-data = { cmd = "python tools/view_polycam.py --polycam-zip-path data/example-room-scan-poly.zip", depends-on = [
    "_download-example-polycam-data",
], description = "View example polycam data" }


[tool.pixi.tasks.view-exoego-data]
cmd = "python tools/view_exoego.py"

description = "View example hocap data"
depends-on = ["_download-hocap-sample"]

[tool.pixi.tasks._download-example-polycam-data]
cmd = """
    test -e data/example-room-scan-poly.zip
    || (
        huggingface-cli download pablovela5620/polycam-example-data \
        example-room-scan-poly.zip --repo-type dataset \
        --local-dir data/
    )
    """
outputs = ["data/example-room-scan-poly.zip"]
description = "Downloads an example polycam dataset from huggingface, this may take a while"

[tool.pixi.tasks._download-example-easymocap-data]
cmd = """
    test -e data/412-hand.zip
    || (
        huggingface-cli download pablovela5620/easymocap-example-data \
        412-hand.zip --repo-type dataset \
        --local-dir data/
    )
    """
outputs = ["data/412-hand.zip"]
description = "Downloads an example easymocap dataset from huggingface, this may take a while"

[tool.pixi.tasks._download-hocap-sample]
cmd = """
    test -e data/hocap/sample.zip \
    && test -e data/hocap/sample \
    || (
        mkdir -p data/hocap/ \
        && huggingface-cli download pablovela5620/hocap-sample \
        sample.zip --repo-type dataset \
        --local-dir data/hocap/ \
        && unzip -o data/hocap/sample.zip -d data/hocap/
    )
    """
outputs = ["data/hocap/sample.zip", "data/hocap/sample"]
description = "Downloads and extracts an example polycam dataset from huggingface, this may take a while"

[tool.pixi.tasks._download-assembly101-sample]
cmd = """
test -e data/assembly101-sample \
  || (huggingface-cli download pablovela5620/Assembly101-Sample \
    --repo-type dataset \
    --include "assembly101-sample/**" \
    --local-dir data/)
"""
outputs = ["data/assembly101-sample"]
description = "Downloads an example assembly101 dataset from huggingface"

[tool.pixi.tasks._download-assembly101-720-sample]
cmd = """
test -e data/assembly101-720-sample \
  || (huggingface-cli download pablovela5620/Assembly101-Sample \
    --repo-type dataset \
    --include "assembly101-720-sample/**" \
    --local-dir data/)
"""
outputs = ["data/assembly101-720-sample"]
description = "Downloads an example assembly101 720p dataset from huggingface"

[tool.pixi.pypi-dependencies]
simplecv = { path = ".", editable = true }
rtmlib = { git = "https://github.com/pablovela5620/rtmlib.git", rev = "98bca2193c39b349034b280803b54c9ee58f7c68" }
wilor-nano = { git = "https://github.com/pablovela5620/wilor-nano.git", rev = "70d01f333960113f825d2f7994a85fce5c51d61a" }
timm = "<1.0"  # Pin for wilor-nano compatibility (RotaryEmbedding import moved in 1.0)


[tool.pixi.dependencies]
python = ">=3.10,<3.13"
jaxtyping = ">=0.3.7,<0.3.8"
numpy = ">=2.0"
einops = ">=0.8.0,<0.9"
icecream = ">=2.1.3,<3"
py-opencv = ">=4.10.0,<5"
pyserde = ">=0.20.0,<0.21"
tyro = ">=0.9.1,<0.10"
tqdm = ">=4.67.1,<5"
huggingface_hub = ">=0.27.1,<0.28"
open3d = ">=0.18.0,<0.19"
scipy = ">=1.15.2,<2"
natsort = ">=8.4.0,<9"
av = "*"
pytorch = ">=2.7,<2.8"
torchvision = "*"
torchcodec = "*"

hdf5 = "*"
h5py = ">=3.12.1,<4"
jupyterlab = ">=4.4.9,<5"
dill = ">=0.3.8,<0.4.1"
datasets = ">=4.0.0"

[tool.pixi.target.linux-64.dependencies]

# cuda129 begin
[tool.pixi.feature.cuda129]
platforms = ["linux-64"]
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.feature.cuda129.system-requirements]
cuda = "12.9"

[tool.pixi.feature.cuda129.dependencies]
# CUDA Build Tools
cuda-compiler = "*"
cuda-version = "12.9.*"
cuda-cudart-dev = "*"
cuda-crt = "*"
libcusparse-dev = "*"
cuda-driver-dev = "*"
cuda-nvcc = "*"
cuda-nvrtc-dev = "*"
cuda-nvtx = "*"
cuda-nvtx-dev = "*"
cuda-nvml-dev = "*"
cuda-profiler-api = "*"

# CUDA Libraries
cudnn = "*"
libcublas-dev = "*"
libcudss-dev = "*"
libcufile-dev = "*"
libcufft-dev = "*"
libcurand-dev = "*"
libcusolver-dev = "*"
cusparselt = "*"
libnvjitlink = "*"
# cuda129 end
pytorch-gpu = ">=2.7,<2.8"
torchvision = "*"
torchcodec = "*"

[tool.pixi.feature.cuda129.pypi-dependencies]
jax = ">=0.6.0,<0.7"
jaxopt = ">=0.8.5,<0.9"
lovely-jax = "*"
onnxruntime-gpu = ">=1.22.0,<2"  # GPU version overrides CPU-only onnxruntime

[tool.pixi.feature.dev]
platforms = ["linux-64"]
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.feature.dev.dependencies]
beartype = ">=0.21.0,<0.22"
ruff = ">=0.12.7,<0.13"
pytest = ">=8.3.3,<9"
hypothesis = ">=6.112.1,<7"
pyrefly = "==0.50.0"
types-tqdm = ">=4.67.0,<5"
pyarrow-stubs = "*"

[tool.pixi.feature.dev.pypi-dependencies]
pytest-beartype = ">=0.2,<1"
ipython-beartype = "*"

[tool.pixi.feature.dev.tasks]
# Run tests in the dev environment
tests = { cmd = "pytest -q", description = "Run pytest in the dev environment" }
lint = { cmd = "ruff check .", description = "Run Ruff linter" }
test_and_lint = { depends-on = [
    "tests",
    "lint",
], description = "Alias for 'tests'" }


[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
# Enable pytest-beartype and jaxtyping's import hook so function boundaries in
# both the library and tests get runtime shape/dtype checks via beartype.
addopts = "--beartype-packages=tests"

[tool.pixi.feature.t265]
platforms = ["linux-64"]
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.feature.t265.dependencies]
python = "==3.10"
tyro = ">=0.9.1,<0.10"
beartype = ">=0.21.0,<0.22"
jaxtyping = ">=0.3.7,<0.3.8"
pyserde = ">=0.23.0,<0.24"
librealsense = "==2.53.1"
# rerun-sdk = ">=0.25.1"
numpy = ">=2.0"
einops = ">=0.8.0,<0.9"
py-opencv = ">=4.10.0,<5"
av = "*"

[tool.pixi.feature.t265.pypi-dependencies]
pyrealsense2 = "==2.53.1.4623"

[tool.pixi.feature.t265.tasks]
# T265 diagnostics helpers (run with: pixi run -e t265 <task>)
t265-enum = { cmd = "rs-enumerate-devices", description = "List RealSense devices using librealsense CLI" }

[tool.pixi.environments]
default = { features = [] }
cuda129 = { features = [
    "cuda129",
], solve-group = "cuda129", no-default-feature = true }
t265 = { features = ["t265"], no-default-feature = true }
gpu = { features = ["cuda129"], solve-group = "cuda129" }
dev = { features = ["dev", "cuda129"], solve-group = "cuda129" }
notebook = { features = ["notebook"] }


# Minimal environment for running data extraction notebooks without heavy ML deps
[tool.pixi.feature.notebook]
platforms = ["linux-64"]
channels = ["https://prefix.dev/conda-forge"]

[tool.pixi.feature.notebook.dependencies]
python = ">=3.10,<3.13"
jupyterlab = ">=4.4.9,<5"
av = "*"
numpy = ">=2.0"
pandas = ">=2.3"
jaxtyping = ">=0.3.7,<0.3.8"
pytorch = ">=2.7,<2.8"
torchcodec = "*"

[tool.pixi.feature.notebook.tasks]
extraction-notebook = { cmd = "jupyter lab notebooks/exoego_data_extraction.ipynb", description = "Run the data extraction notebook" }


[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    "E501",  # Line too long.
    "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
    "UP037", # Remove quotes from type, false positive when using jaxtyping
    "UP040", # Beartype fails if not using this for typealias

]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/node_modules", "**/__pycache__", "**/*pixi/**/*"]
